name: Gerar pacote distribuível v4.3.3

on:
  push:
    branches:
      - portfoliolimavirtual

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código da versão
        uses: actions/checkout@v4

      - name: Montar arquivo ZIP completo
        run: |
          zip -r Painel_de_Oportunidades_v4.3.3.zip . \
            -x ".git/*" "node_modules/*" "Painel_de_Oportunidades_v4.3.3.zip" ".DS_Store"

      - name: Publicar pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Painel_de_Oportunidades_v4.3.3
          path: Painel_de_Oportunidades_v4.3.3.zip
          if-no-files-found: error
          retention-days: 30
